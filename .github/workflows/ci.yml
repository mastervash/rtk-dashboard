name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor; 22 catches anything that assumes newer.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Seed and boot the server against a synthetic database
        run: |
          node scripts/seed-demo.mjs /tmp/demo
          RTKDASH_DB=/tmp/demo/history.db \
          RTKDASH_CONFIG_DIR=/tmp/demo/config \
          RTKDASH_API_PORT=5178 \
          node server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5178/api/summary >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5178/api/summary
          curl -sf http://127.0.0.1:5178/ >/dev/null
